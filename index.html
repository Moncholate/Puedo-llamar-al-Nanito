<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>¿Puedo llamar al Nanito?</title>
<meta name="description" content="Averigua al instante si el Nanito puede contestar el teléfono ahora mismo." />
<meta name="theme-color" content="#0E5C46" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%9E</text></svg>" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta property="og:title" content="¿Puedo llamar al Nanito?" />
<meta property="og:description" content="La respuesta, en tiempo real." />
<meta property="og:image" content="https://moncholate.github.io/Puedo-llamar-al-Nanito/og-image.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://moncholate.github.io/Puedo-llamar-al-Nanito/" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://moncholate.github.io/Puedo-llamar-al-Nanito/og-image.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#17203F; --ink:#DDE3F2; --dim:rgba(221,227,242,.62); --accent:#85B7EB;
    --line:rgba(255,255,255,.16);
    --font-display:"Bricolage Grotesque",system-ui,sans-serif;
    --font-body:"Instrument Sans",system-ui,sans-serif;
    --font-mono:"Space Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body); line-height:1.5;
    -webkit-font-smoothing:antialiased;
    transition:background-color .6s ease, color .6s ease;
    display:flex; flex-direction:column;
    padding:clamp(20px,5vw,56px);
    gap:clamp(24px,5vh,48px);
  }
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
    font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .clock{color:var(--ink);font-weight:700;letter-spacing:.08em}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1100px;width:100%;margin:0 auto}
  .portrait{height:clamp(200px,32vh,320px);width:fit-content;max-width:100%;border-radius:24px;
    overflow:hidden;margin-bottom:clamp(16px,2.5vh,24px);border:1px solid var(--line);
    background:rgba(255,255,255,.04);transition:border-color .6s ease,background-color .6s ease}
  .portrait img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:clamp(12px,2vh,20px)}
  .verdict{
    font-family:var(--font-display);
    font-size:clamp(3.4rem,13vw,9rem);
    font-weight:800; line-height:.92; letter-spacing:-.035em;
    text-wrap:balance;
  }
  .detail{
    font-size:clamp(1.05rem,2.6vw,1.55rem); color:var(--dim);
    margin-top:clamp(14px,2.5vh,24px); max-width:34ch; text-wrap:pretty;
  }
  .detail b{color:var(--ink);font-weight:500}

  footer{max-width:1100px;width:100%;margin:0 auto;border-top:1px solid var(--line);padding-top:20px}
  .toggle{background:none;border:1px solid var(--line);color:var(--ink);cursor:pointer;
    font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    padding:9px 16px;border-radius:999px;transition:background-color .2s ease,border-color .2s ease}
  .toggle:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.34)}
  .toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .week{margin-top:24px;display:none}
  .week.open{display:block}
  .cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .calendar{display:grid;grid-template-columns:36px repeat(5,minmax(132px,1fr));gap:0 8px;min-width:716px}
  .cal-hours{position:sticky;left:0;z-index:1;background:var(--bg);
    height:clamp(600px,86vh,780px)}
  .cal-hour{position:absolute;left:0;right:6px;transform:translateY(-50%);
    font-family:var(--font-mono);font-size:10px;color:var(--dim);text-align:right}
  .cal-day{display:flex;flex-direction:column;gap:8px}
  .cal-daylabel{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);text-align:center}
  .cal-day.today .cal-daylabel{color:var(--accent)}
  .cal-track{position:relative;height:clamp(600px,86vh,780px);border-radius:10px;
    background:rgba(255,255,255,.03)}
  .cal-day.today .cal-track{background:rgba(255,255,255,.07)}
  .cal-hline{position:absolute;left:0;right:0;height:1px;background:var(--line)}
  .cal-block{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 6px;
    overflow:hidden;background:rgba(255,255,255,.18);color:var(--ink);
    display:flex;flex-direction:column;justify-content:flex-start;gap:1px}
  .cal-block[data-kind="clase"]{background:#F2C14E;color:#2B1D04}
  .cal-block[data-kind="inclusion"]{background:#5EC8D8;color:#04272B}
  .cal-block[data-kind="reunion"]{background:#5EC8D8;color:#04272B}
  .cal-block.current{box-shadow:0 0 0 2px var(--ink);z-index:2}
  .cal-time{font-family:var(--font-mono);font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
  .cal-label{font-size:10.5px;line-height:1.22;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
  .cal-label-solo{font-size:11px;line-height:1.15;margin:auto 0;-webkit-line-clamp:2}
  .cal-now{position:absolute;left:-2px;right:-2px;height:2px;background:var(--accent);
    box-shadow:0 0 0 1px rgba(0,0,0,.45);z-index:3}
  .cal-now::before{content:"";position:absolute;left:-2px;top:50%;transform:translateY(-50%);
    width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 1px rgba(0,0,0,.45)}
  .note{margin-top:26px;font-size:12px;color:var(--dim);max-width:62ch}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <span>Santiago de Chile</span>
  <span class="clock" id="clock">--:--</span>
</div>

<main>
  <div class="portrait"><img id="portraitImg" src="" alt="" /></div>
  <p class="eyebrow" id="eyebrow">Cargando…</p>
  <h1 class="verdict" id="verdict">Un segundo</h1>
  <p class="detail" id="detail">Revisando el horario.</p>
</main>

<footer>
  <button class="toggle" id="toggle" aria-expanded="false" aria-controls="week">Ver la semana completa</button>
  <div class="week" id="week"></div>
  <p class="note">Horario del semestre 2026-2.</p>
</footer>

<script>
const TZ = "America/Santiago";

const t = (hhmm) => { const [h,m] = hhmm.split(":").map(Number); return h*60+m; };

const SCHEDULE = {
  1:[ ["12:11","13:40","inclusion","horas de inclusión virtual",""],
      ["17:31","18:50","inclusion","horas de inclusión presencial",""],
      ["19:01","21:10","clase","Inglés intermedio","AL-406","INI5111-002V(T)"],
      ["21:11","22:30","clase","Inglés intermedio I","AL-405","INU5101-001V(T)"] ],
  2:[ ["13:01","14:20","clase","Inglés elemental I","AL-404","INU3101-010D(T)"],
      ["19:01","20:20","clase","Inglés elemental I","AL-503A","INU3101-005V(T)"],
      ["20:31","21:10","inclusion","horas de inclusión presencial",""],
      ["21:11","22:30","clase","Inglés básico II","AL-503A","INU2101-002V(T)"] ],
  3:[ ["11:31","12:50","reunion","reunión del equipo de inclusión",""],
      ["13:01","13:40","inclusion","horas de inclusión virtual",""],
      ["17:31","18:50","inclusion","horas de inclusión presencial",""],
      ["19:01","21:10","clase","Inglés intermedio","AL-406","INI5111-002V(T)"],
      ["21:11","22:30","clase","Inglés intermedio I","AL-405","INU5101-001V(T)"] ],
  4:[ ["13:01","14:20","clase","Inglés elemental I","AL-310","INU3101-010D(T)"],
      ["19:01","20:20","clase","Inglés elemental I","AL-405","INU3101-005V(T)"] ],
  5:[ ["12:11","13:40","inclusion","horas de inclusión virtual",""],
      ["19:01","20:20","clase","Inglés intermedio","AL-310","INI5111-002V(T)"],
      ["20:31","21:10","inclusion","horas de inclusión presencial",""],
      ["21:11","22:30","clase","Inglés básico II","AL-411","INU2101-002V(T)"] ],
  6:[], 0:[]
};

const DAY_NAMES = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const WAKE_UP = t("10:00");
const CHAIN_GAP = 15;

// 4 estados posibles. Cada uno pinta un color de tema y una foto en Fotos/.
const THEMES = {
  disponible: {bg:"#0E5C46", ink:"#DFF3EA", dim:"rgba(223,243,234,.66)", accent:"#7FD9B4"},
  quizas:     {bg:"#8A5A0E", ink:"#FBEEDA", dim:"rgba(251,238,218,.66)", accent:"#F5C46A"},
  ocupado:    {bg:"#8A2B22", ink:"#FBE7E2", dim:"rgba(251,231,226,.66)", accent:"#F0997B"},
  durmiendo:  {bg:"#17203F", ink:"#DDE3F2", dim:"rgba(221,227,242,.66)", accent:"#85B7EB"}
};

const IMAGES = {
  disponible: "Fotos/Disponible.jpg",
  quizas:     "Fotos/Maybe.jpg",
  ocupado:    "Fotos/Ocupao.jpg",
  durmiendo:  "Fotos/Mimiendo.jpg"
};


function nowInSantiago(){
  const parts = new Intl.DateTimeFormat("es-CL",{timeZone:TZ,weekday:"short",hour:"2-digit",
    minute:"2-digit",hour12:false}).formatToParts(new Date());
  const get = k => parts.find(p=>p.type===k).value;
  const wd = {"dom":0,"lun":1,"mar":2,"mié":3,"mie":3,"jue":4,"vie":5,"sáb":6,"sab":6};
  const key = get("weekday").toLowerCase().replace(".","").slice(0,3);
  return {day:wd[key], minutes:Number(get("hour"))*60+Number(get("minute")),
          hh:get("hour"), mm:get("minute")};
}

function fmt(mins){
  const h = String(Math.floor(mins/60)).padStart(2,"0");
  const m = String(mins%60).padStart(2,"0");
  return h+":"+m;
}

function blocksFor(day){
  return (SCHEDULE[day]||[]).map(b=>({start:t(b[0]),end:t(b[1]),kind:b[2],label:b[3],room:b[4],sigla:b[5]}));
}

function chainEnd(blocks, i){
  let end = blocks[i].end;
  for(let j=i+1;j<blocks.length;j++){
    if(blocks[j].start - end <= CHAIN_GAP) end = blocks[j].end; else break;
  }
  return end;
}

function nextBlock(blocks, mins){
  return blocks.find(b=>b.start > mins) || null;
}

function decide(){
  const now = nowInSantiago();
  const blocks = blocksFor(now.day);

  // Ta mimiendo: de 00:00 a 10:00, todos los días.
  if(now.minutes < WAKE_UP){
    return {state:"durmiendo", eyebrow:"Fuera de horario", verdict:"¡Ta mimiendo!",
      detail:"Debería estar durmiendo. Escríbele un mensaje y lo lee al despertar."};
  }

  // ¿Está en medio de un bloque ahora mismo?
  const idx = blocks.findIndex(b => now.minutes >= b.start && now.minutes <= b.end);
  if(idx !== -1){
    const b = blocks[idx];
    const free = chainEnd(blocks, idx);

    if(b.kind === "clase"){
      return {state:"ocupado", eyebrow:"Ocupado ahora", verdict:"¡Ta ocupao!",
        detail:`Está haciendo clases de <b>${b.label}</b> en la sala ${b.room}. Queda libre a las <b>${fmt(free)}</b>.`};
    }
    if(b.kind === "reunion"){
      return {state:"ocupado", eyebrow:"Ocupado ahora", verdict:"¡Ta ocupao!",
        detail:`Está en <b>${b.label}</b>. Queda libre a las <b>${fmt(free)}</b>.`};
    }
    // horas de inclusión (que no son la reunión de equipo)
    return {state:"quizas", eyebrow:"Quizás toy ocupao", verdict:"Juégatela.",
      detail:`Está en <b>${b.label}</b>. Puede que conteste — queda libre a las <b>${fmt(free)}</b>.`};
  }

  // Libre por ahora: ¿queda un bloque muy pronto?
  const nxt = nextBlock(blocks, now.minutes);
  if(nxt){
    const gap = nxt.start - now.minutes;
    if(gap <= 20){
      return {state:"quizas", eyebrow:"Quizás toy ocupao", verdict:"Juégatela.",
        detail:`Le quedan <b>${gap} minutos</b> antes de ${nxt.room ? "entrar a clases" : "su siguiente bloque"}. Puede que no alcance a contestar.`};
    }
    return {state:"disponible", eyebrow:"Disponible", verdict:"¡Llama al toque!",
      detail:`Está libre hasta las <b>${fmt(nxt.start)}</b>. Tienes ${Math.floor(gap/60)>0 ? Math.floor(gap/60)+" h "+(gap%60)+" min" : gap+" min"} por delante.`};
  }

  const weekend = now.day === 0 || now.day === 6;
  return {state:"disponible", eyebrow:weekend ? "Fin de semana" : "Disponible",
    verdict:"¡Llama al toque!",
    detail: weekend
      ? "No tiene clases ni bloques de inclusión hoy. Aprovecha."
      : "Ya terminó todos sus bloques de hoy."};
}

function paint(){
  const r = decide();
  const th = THEMES[r.state];
  const root = document.documentElement.style;
  root.setProperty("--bg",th.bg); root.setProperty("--ink",th.ink);
  root.setProperty("--dim",th.dim); root.setProperty("--accent",th.accent);
  document.querySelector('meta[name="theme-color"]').setAttribute("content",th.bg);

  const now = nowInSantiago();
  document.getElementById("clock").textContent = now.hh+":"+now.mm;
  document.getElementById("eyebrow").textContent = r.eyebrow;
  document.getElementById("verdict").textContent = r.verdict;
  document.getElementById("detail").innerHTML = r.detail;

  const portrait = document.getElementById("portraitImg");
  const src = IMAGES[r.state];
  if(portrait.getAttribute("data-state") !== r.state){
    portrait.setAttribute("data-state", r.state);
    portrait.onerror = () => { portrait.closest(".portrait").style.display = "none"; };
    portrait.onload = () => { portrait.closest(".portrait").style.display = ""; };
    portrait.src = src;
  }
  portrait.alt = r.verdict;

  updateCalendarNow();
}

const CAL_START = t("08:31"), CAL_END = t("22:30");
const calPct = mins => (mins - CAL_START) / (CAL_END - CAL_START) * 100;

function buildWeek(){
  const wrap = document.getElementById("week");
  const hours = [];
  for(let h = Math.ceil(CAL_START/60); h <= Math.floor(CAL_END/60); h++) hours.push(h);

  const hoursHtml = hours.map(h =>
    `<span class="cal-hour" style="top:${calPct(h*60)}%">${String(h).padStart(2,"0")}</span>`
  ).join("");

  const daysHtml = [1,2,3,4,5].map(d=>{
    const linesHtml = hours.map(h => `<i class="cal-hline" style="top:${calPct(h*60)}%"></i>`).join("");
    const blocksHtml = blocksFor(d).map(b=>{
      const name = b.kind === "clase"
        ? (b.sigla ? b.sigla+" " : "") + b.label + (b.room ? " · "+b.room : "")
        : b.label;
      const short = b.kind === "reunion" ? "Reunión de equipo"
        : b.kind === "inclusion" ? b.label.replace(/^horas de /, "").replace(/^./, c => c.toUpperCase())
        : name;
      const top = calPct(b.start), height = calPct(b.end) - calPct(b.start);
      // Los bloques muy cortos (≤50 min) no alcanzan a mostrar hora + texto en 2 líneas: solo el texto, una línea.
      const inner = (b.end - b.start) <= 50
        ? `<span class="cal-label cal-label-solo">${short}</span>`
        : `<span class="cal-time">${fmt(b.start)}–${fmt(b.end)}</span><span class="cal-label">${short}</span>`;
      return `<div class="cal-block" data-kind="${b.kind}" data-start="${b.start}" style="top:${top}%;height:${height}%" title="${name} · ${fmt(b.start)}–${fmt(b.end)}">
        ${inner}
      </div>`;
    }).join("");
    return `<div class="cal-day" data-day="${d}">
      <p class="cal-daylabel">${DAY_NAMES[d].slice(0,3)}</p>
      <div class="cal-track">${linesHtml}${blocksHtml}</div>
    </div>`;
  }).join("");

  wrap.innerHTML = `<div class="cal-scroll"><div class="calendar">
    <div class="cal-hours">${hoursHtml}</div>
    ${daysHtml}
  </div></div>`;
}

function updateCalendarNow(){
  const now = nowInSantiago();
  document.querySelectorAll(".cal-day").forEach(col=>{
    col.classList.remove("today");
    const line = col.querySelector(".cal-now");
    if(line) line.remove();
  });
  document.querySelectorAll(".cal-block.current").forEach(el => el.classList.remove("current"));

  if(now.day < 1 || now.day > 5 || now.minutes < CAL_START || now.minutes > CAL_END) return;

  const col = document.querySelector(`.cal-day[data-day="${now.day}"]`);
  if(!col) return;
  col.classList.add("today");
  const line = document.createElement("i");
  line.className = "cal-now";
  line.style.top = calPct(now.minutes) + "%";
  col.querySelector(".cal-track").appendChild(line);

  const currentBlock = blocksFor(now.day).find(b => now.minutes >= b.start && now.minutes <= b.end);
  if(currentBlock){
    const el = col.querySelector(`.cal-block[data-start="${currentBlock.start}"]`);
    if(el) el.classList.add("current");
  }
}

document.getElementById("toggle").addEventListener("click", e=>{
  const w = document.getElementById("week");
  const open = w.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", String(open));
  e.currentTarget.textContent = open ? "Ocultar la semana" : "Ver la semana completa";
});

buildWeek();
paint();
setInterval(paint, 20000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) paint(); });
</script>
</body>
</html>
